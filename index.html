<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>さんすうブロック - けいさんれんしゅう</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='18' fill='%23ff9f43'/><rect x='26' y='26' width='48' height='48' rx='10' fill='%23fff' opacity='.35'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ホーム画面 -->
  <section id="screen-home" class="screen active">
    <div class="title-blocks" aria-hidden="true">
      <span class="tb tb-a"></span><span class="tb tb-b"></span><span class="tb tb-c"></span>
    </div>
    <h1 class="app-title">さんすうブロック</h1>
    <p class="app-sub">ブロックと さくらんぼで<br>くりあがり・くりさがりを マスターしよう！</p>
    <div class="menu">
      <button class="menu-btn menu-add" data-goto="add">
        <span class="menu-main">たしざん</span>
        <span class="menu-small">くりあがりの けいさん</span>
      </button>
      <button class="menu-btn menu-sub" data-goto="sub-select">
        <span class="menu-main">ひきざん</span>
        <span class="menu-small">くりさがりの けいさん</span>
      </button>
      <button class="menu-btn menu-rec" data-goto="records">
        <span class="menu-main">きろく</span>
        <span class="menu-small">がんばりを みてみよう</span>
      </button>
    </div>
  </section>

  <!-- ひきざん ほうほうえらび -->
  <section id="screen-sub-select" class="screen">
    <header class="simple-header">
      <button class="icon-btn btn-back" data-goto="home">←</button>
      <h2>ひきざんの やりかたを えらぼう</h2>
    </header>
    <div class="menu">
      <button class="menu-btn menu-genka" data-mode="genka">
        <span class="menu-main">げんかほう</span>
        <span class="menu-small">10から ひいて、のこりと たす</span>
        <span class="menu-example">13−9 → 10−9=1 → 1+3=4</span>
      </button>
      <button class="menu-btn menu-gengen" data-mode="gengen">
        <span class="menu-main">げんげんほう</span>
        <span class="menu-small">ばらから じゅんばんに ひく</span>
        <span class="menu-example">13−9 → 13−3=10 → 10−6=4</span>
      </button>
      <button class="menu-btn menu-mix" data-mode="mix">
        <span class="menu-main">ミックス</span>
        <span class="menu-small">どちらの やりかたも れんしゅう</span>
      </button>
    </div>
  </section>

  <!-- れんしゅう画面 -->
  <section id="screen-play" class="screen">
    <header class="play-header">
      <button class="icon-btn btn-back" data-goto="quit">←</button>
      <div id="star-row" aria-label="せいかいの かず"></div>
      <div id="streak-badge" title="れんぞく せいかい">🔥<span id="streak-num">0</span></div>
      <button class="icon-btn" id="btn-sound" aria-label="おと">🔊</button>
    </header>

    <div id="method-badge"></div>
    <div id="equation" aria-live="polite"></div>

    <div id="block-stage">
      <div id="frame-area"></div>
      <div id="loose-area"></div>
    </div>

    <div id="prompt-box">
      <p id="prompt"></p>
      <div id="answer-display" class="waiting">?</div>
    </div>

    <div id="feedback" aria-live="assertive"></div>

    <div id="keypad"></div>
  </section>

  <!-- せいかいオーバーレイ -->
  <div id="overlay-correct" class="overlay">
    <div class="overlay-card">
      <div id="correct-text" class="big-praise">せいかい！</div>
      <div class="confetti" aria-hidden="true">
        <span>🎉</span><span>⭐</span><span>🎊</span><span>✨</span><span>🌟</span>
      </div>
    </div>
  </div>

  <!-- セットクリア -->
  <div id="overlay-set" class="overlay">
    <div class="overlay-card">
      <div class="big-praise">5もん クリア！</div>
      <div id="set-stars" class="set-stars"></div>
      <p id="set-message">よく がんばったね！</p>
      <div class="overlay-btns">
        <button class="menu-btn menu-add" id="btn-continue">
          <span class="menu-main">つづける</span>
        </button>
        <button class="menu-btn menu-rec" id="btn-set-home">
          <span class="menu-main">ホームへ</span>
        </button>
      </div>
    </div>
  </div>

  <!-- きろく画面 -->
  <section id="screen-records" class="screen">
    <header class="simple-header">
      <button class="icon-btn btn-back" data-goto="home">←</button>
      <h2>がんばりの きろく</h2>
    </header>
    <div id="records-list"></div>
    <button id="btn-reset-records" class="danger-btn">きろくを けす</button>
  </section>

</div>
<script src="js/audio.js"></script>
<script src="js/blocks.js"></script>
<script src="js/main.js"></script>
</body>
</html>
